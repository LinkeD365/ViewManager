name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create release pull request
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Enable auto-merge for release pull request
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$RELEASE_PR")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Release Please returned an invalid pull request number." >&2
            exit 1
          fi
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --merge

          for attempt in {1..32}; do
            pr_status="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json state,mergedAt \
              --jq 'if .mergedAt != null then "merged"
                elif .state == "CLOSED" then "closed"
                else "open" end')"
            if [[ "$pr_status" == "merged" ]]; then
              gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            if [[ "$pr_status" == "closed" ]]; then
              echo "Release pull request was closed without merging." >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the release pull request to merge." >&2
          exit 1

  publish:
    name: Publish to npm
    needs: release
    if: ${{ needs.release.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772620 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.release-tag }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance
